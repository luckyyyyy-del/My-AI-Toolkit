<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Email Generator — My AI Toolkit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">

      <a href="index.html" class="nav__logo">My AI Toolkit</a>

      <button
        class="nav__toggle"
        id="navToggle"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav__links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#tools">Tools</a></li>
        <li><a href="index.html#about">About</a></li>
      </ul>

    </nav>
  </header>

  <main class="tool-page">

    <a href="index.html#tools" class="tool-page__back">
      &larr; Back to toolkit
    </a>

    <div class="tool-page__intro">

      <p class="hero__eyebrow">Tool 2 of 7</p>

      <h1>Email Generator</h1>

      <p class="tool-page__subtitle">
        Describe what you need to say, and get a ready-to-send email.
      </p>

    </div>

    <form class="rewriter" id="emailForm">

      <label for="contextInput">
        What's this email about?
      </label>

      <textarea
        id="contextInput"
        rows="4"
        placeholder="e.g. Asking my landlord to fix a broken heater, and I've already asked once last week"
        required
      ></textarea>

      <label for="recipientInput">
        Who are you writing to? (optional)
      </label>

      <input
        type="text"
        id="recipientInput"
        placeholder="e.g. my landlord, a hiring manager, my professor"
      />

      <label for="toneSelect">
        Tone
      </label>

      <select id="toneSelect">
        <option value="formal">Formal</option>
        <option value="friendly">Friendly</option>
        <option value="direct">Direct / assertive</option>
        <option value="apologetic">Apologetic</option>
      </select>

      <button
        type="submit"
        class="btn btn--primary"
        id="generateBtn"
      >
        Generate email
      </button>

      <p class="tool-page__note">
        Powered by Claude (Anthropic's AI model).
      </p>

    </form>

    <p
      class="error-text"
      id="errorText"
      hidden
    ></p>

    <section
      class="result"
      id="resultSection"
      hidden
    >

      <div class="result__header">

        <h2>Result</h2>

        <button
          class="btn btn--ghost"
          id="copyBtn"
          type="button"
        >
          Copy
        </button>

      </div>

      <p
        class="result__text"
        id="resultText"
      ></p>

    </section>

  </main>

  <footer class="site-footer">

    <p>
      &copy; 2026 My AI Toolkit. Built while learning.
    </p>

  </footer>

  <script src="script.js"></script>
  <script src="email.js"></script>

</body>

</html>
